name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # 1. Đảm bảo thư mục tồn tại
            mkdir -p /var/www/web-thong-ke-dau-gia
            cd /var/www/web-thong-ke-dau-gia
            
            # 2. Pull code mới nhất từ GitHub
            if [ ! -d ".git" ]; then
              git clone https://github.com/kinnhun/web-thong-ke-dau-gia.git .
            else
              git fetch --all
              git reset --hard origin/main
              git pull origin main
            fi
            
            # 3. Cài đặt các gói phụ thuộc (NPM Workspaces sẽ tự cài cho cả Frontend và Backend)
            npm install
            
            # 4. Build giao diện Next.js
            npm run build
            
            # 5. Khởi động / Khởi động lại dự án thông qua PM2
            pm2 startOrRestart ecosystem.config.js
            pm2 save
