name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_DEPLOYMENT_ID: ${{ github.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "."
          target: "/var/www/web-thong-ke-dau-gia"
          rm: true

      - name: Build and Restart PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            export NEXT_DEPLOYMENT_ID="${{ github.sha }}"
            export GITHUB_SHA="${{ github.sha }}"
            cd /var/www/web-thong-ke-dau-gia
            rm -rf .next
            npm ci
            npm run build
            pm2 delete daugia-frontend || true
            pm2 delete daugia-backend || true
            pm2 start ecosystem.config.js --update-env
            pm2 save
